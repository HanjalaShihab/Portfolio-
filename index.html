<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hanjala Shihab — Backend / Laravel / Full Stack Developer. Building robust, scalable web applications with PHP, Laravel, React and modern engineering practices." />
    <meta name="theme-color" content="#08080C" id="theme-color-meta" />
    <script>
      // Apply saved/system theme before first paint to avoid flash of wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          var meta = document.getElementById('theme-color-meta')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F6F6F9' : '#08080C')
        } catch (e) {}
      })()
    </script>
    <meta property="og:title" content="Hanjala Shihab — Backend / Full Stack Developer" />
    <meta property="og:description" content="Laravel, PHP, React & AI-powered engineering. Explore projects, case studies and more." />
    <meta property="og:type" content="website" />
